<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spherical Harmonics</title>
<style>
  html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #0d0d0d; overflow: hidden;
      font-family: Inter, system-ui, sans-serif;
      color: #ddd;
  }
  #app { display: flex; flex-direction: column; height: 100%; }

  #stage { position: relative; flex: 1 1 auto; min-height: 0; background: #000; }
  /* raylib sets the backing size to 1280x720 in InitWindow; letting CSS scale
     that keeps the aspect uniform and avoids fighting it over canvas size. */
  canvas.emscripten {
      display: block; width: 100%; height: 100%;
      border: 0; outline: none; background: #000;
  }

  #loading {
      position: absolute; inset: 0; display: flex;
      flex-direction: column; align-items: center; justify-content: center;
      color: #ddd; font-size: 0.9rem; gap: 14px; background: #000; text-align: center;
  }
  #bar { width: 220px; height: 4px; background: #333; border-radius: 2px; overflow: hidden; }
  #barFill { height: 100%; width: 0%; background: #6ab8ff; transition: width 0.15s linear; }
  #note { color: #888; font-size: 0.78rem; max-width: 32ch; line-height: 1.5; }
  #loading.done { display: none; }

  /* ── controls ──────────────────────────────────────────── */
  #controls {
      flex: 0 0 auto;
      border-top: 1px solid #262626;
      background: #131313;
      padding: 12px 16px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px 22px;
      align-items: start;
      font-size: 0.8rem;
  }
  #controls[hidden] { display: none; }

  .ctl { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .ctl-label {
      display: flex; justify-content: space-between; align-items: baseline;
      gap: 8px; color: #9a9a9a; letter-spacing: 0.02em;
  }
  .ctl-label b { color: #e8e8e8; font-weight: 600; font-variant-numeric: tabular-nums; }

  input[type=range] {
      width: 100%; margin: 0; accent-color: #6ab8ff;
      background: transparent; cursor: pointer;
  }

  .seg { display: flex; gap: 0; }
  .seg button {
      flex: 1 1 0; min-width: 0;
      font: inherit; font-size: 0.76rem;
      color: #bbb; background: #1e1e1e;
      border: 1px solid #333; border-right-width: 0;
      padding: 6px 4px; cursor: pointer;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .seg button:first-child { border-radius: 4px 0 0 4px; }
  .seg button:last-child  { border-radius: 0 4px 4px 0; border-right-width: 1px; }
  .seg button:hover:not([aria-pressed=true]) { background: #272727; color: #eee; }
  .seg button[aria-pressed=true] {
      background: #6ab8ff; border-color: #6ab8ff; color: #06243b; font-weight: 600;
  }

  #gains {
      grid-column: 1 / -1;
      margin: 0; color: #7d7d7d; font-size: 0.74rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: nowrap; overflow-x: auto;
  }
  #gains.clipped { color: #e0913f; }
</style>
</head>
<body>

<div id="app">
    <div id="stage">
        <canvas class="emscripten" id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
        <div id="loading">
            <div id="msg">Downloading environment map…</div>
            <div id="bar"><div id="barFill"></div></div>
            <div id="note">5&nbsp;MB of HDR, then the SH projection runs on the main thread. Give it a few seconds.</div>
        </div>
    </div>

    <div id="controls" hidden>
        <div class="ctl">
            <span class="ctl-label">view</span>
            <div class="seg" id="viewSeg">
                <button type="button" data-view="0">Raw HDR</button>
                <button type="button" data-view="1">SH cube</button>
                <button type="button" data-view="2" aria-pressed="true">SH equirect</button>
            </div>
        </div>

        <div class="ctl">
            <label class="ctl-label" for="lRange">bands kept <b><span id="lVal">3</span> &middot; <span id="coefVal">16</span> coef</b></label>
            <input type="range" id="lRange" min="0" max="3" step="1" value="3">
        </div>

        <div class="ctl">
            <label class="ctl-label" for="wRange">window <b id="wVal">6.0</b></label>
            <input type="range" id="wRange" min="3" max="10" step="0.1" value="6">
        </div>

        <div class="ctl">
            <label class="ctl-label" for="eRange">exposure <b id="eVal">1.00</b></label>
            <input type="range" id="eRange" min="-3" max="3" step="0.05" value="0">
        </div>

        <p id="gains">band gain:</p>
    </div>
</div>

<script type="text/javascript">
  var canvasEl   = document.getElementById('canvas');
  var loadingEl  = document.getElementById('loading');
  var barFill    = document.getElementById('barFill');
  var msgEl      = document.getElementById('msg');
  var controlsEl = document.getElementById('controls');

  var ready = false;

  var Module = {
      canvas: canvasEl,
      print: function (text) {
          console.log(text);
          // main() runs the whole SH projection *before* InitWindow, so
          // onRuntimeInitialized fires far too early to use as the ready
          // signal. raylib's init log is the first point there is a frame.
          if (!ready && /initialized successfully/i.test(text)) onReady();
      },
      printErr: function (text) { console.error(text); },
      setStatus: function (text) {
          // emscripten reports "Downloading data... (x/y)" while preloading
          var m = text.match(/([\d.]+)\s*\/\s*([\d.]+)/);
          if (m) {
              barFill.style.width = (parseFloat(m[1]) / parseFloat(m[2]) * 100) + '%';
          } else if (!text) {
              barFill.style.width = '100%';
          }
      },
      onRuntimeInitialized: function () {
          msgEl.textContent = 'Projecting into spherical harmonics…';
          barFill.style.width = '100%';
      }
  };

  // ── exported setters ──────────────────────────────────────
  function callSet(name, type, value) {
      if (!ready) return;
      try {
          Module.ccall(name, null, [type], [value]);
      } catch (e) {
          console.error(name + ' failed', e);
      }
  }
  var setView     = function (v) { callSet('SH_SetView', 'number', v); };
  var setL        = function (l) { callSet('SH_SetL', 'number', l); };
  var setWindow   = function (w) { callSet('SH_SetWindow', 'number', w); };
  var setExposure = function (e) { callSet('SH_SetExposure', 'number', e); };
  function bandGain(b) {
      if (!ready) return 1;
      return Module.ccall('SH_BandGain', 'number', ['number'], [b]);
  }

  // ── control wiring ────────────────────────────────────────
  var viewSeg = document.getElementById('viewSeg');
  var lRange  = document.getElementById('lRange');
  var wRange  = document.getElementById('wRange');
  var eRange  = document.getElementById('eRange');
  var lVal    = document.getElementById('lVal');
  var coefVal = document.getElementById('coefVal');
  var wVal    = document.getElementById('wVal');
  var eVal    = document.getElementById('eVal');
  var gainsEl = document.getElementById('gains');

  // Exposure is a stop slider so the useful range is not crammed into the
  // bottom tenth of the track; the C++ side takes a plain multiplier.
  function exposureValue() { return Math.pow(2, parseFloat(eRange.value)); }

  function refreshGains() {
      var l = parseInt(lRange.value, 10);
      var w = parseFloat(wRange.value);
      var parts = [];
      var clipped = false;
      for (var b = 0; b <= l; b++) {
          var g = bandGain(b);
          if (g === 0) clipped = true;
          parts.push(b + ':' + g.toFixed(2));
      }
      gainsEl.textContent = 'band gain:  ' + parts.join('   ');
      // a band you asked to keep is being zeroed by the window
      gainsEl.classList.toggle('clipped', clipped || w <= l);
  }

  viewSeg.addEventListener('click', function (e) {
      var btn = e.target.closest('button[data-view]');
      if (!btn) return;
      var buttons = viewSeg.querySelectorAll('button');
      for (var i = 0; i < buttons.length; i++) {
          buttons[i].setAttribute('aria-pressed', String(buttons[i] === btn));
      }
      setView(parseInt(btn.dataset.view, 10));
  });

  lRange.addEventListener('input', function () {
      var l = parseInt(lRange.value, 10);
      lVal.textContent = l;
      coefVal.textContent = (l + 1) * (l + 1);
      setL(l);
      refreshGains();
  });

  wRange.addEventListener('input', function () {
      var w = parseFloat(wRange.value);
      wVal.textContent = w.toFixed(1);
      setWindow(w);
      refreshGains();
  });

  eRange.addEventListener('input', function () {
      var e = exposureValue();
      eVal.textContent = e.toFixed(2);
      setExposure(e);
  });

  function onReady() {
      ready = true;
      loadingEl.classList.add('done');
      controlsEl.hidden = false;
      // Push the initial slider positions so the page and the C++ defaults
      // cannot disagree if either side's starting value is ever changed.
      setView(parseInt(viewSeg.querySelector('[aria-pressed=true]').dataset.view, 10));
      setL(parseInt(lRange.value, 10));
      setWindow(parseFloat(wRange.value));
      setExposure(exposureValue());
      refreshGains();
  }
</script>

{{{ SCRIPT }}}
</body>
</html>
