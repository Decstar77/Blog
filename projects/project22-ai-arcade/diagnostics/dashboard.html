<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Training Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    color-scheme: light;
    --bg:        #f4f4f2;
    --surface:   #fcfcfb;
    --border:    #e3e2de;
    --grid:      #ecebe7;
    --text:      #0b0b0b;
    --text-2:    #52514e;
    --text-3:    #8a8984;
    --live:      #008300;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
    --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
    --pos: #2a78d6; --neg: #e34948; --node-in: #8a8984; --node-out: #52514e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #111110; --surface: #1a1a19; --border: #2c2c2a; --grid: #262624;
      --text: #f0efec; --text-2: #c3c2b7; --text-3: #85847d; --live: #3fae3f;
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
      --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
      --pos: #3987e5; --neg: #e66767; --node-in: #85847d; --node-out: #c3c2b7;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #111110; --surface: #1a1a19; --border: #2c2c2a; --grid: #262624;
    --text: #f0efec; --text-2: #c3c2b7; --text-3: #85847d; --live: #3fae3f;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
      --pos: #3987e5; --neg: #e66767; --node-in: #85847d; --node-out: #c3c2b7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center;
    padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--surface);
    position: sticky; top: 0; z-index: 2;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header label { color: var(--text-2); display: flex; gap: 8px; align-items: center; }
  header .spacer { flex: 1; }
  #status { color: var(--text-3); font-variant-numeric: tabular-nums; }
  .layout { display: grid; grid-template-columns: 280px 1fr; min-height: calc(100vh - 53px); }
  aside { border-right: 1px solid var(--border); padding: 12px; background: var(--surface); }
  aside h2, .config h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-3); margin: 4px 0 8px; font-weight: 600; }
  .run { display: flex; gap: 8px; align-items: flex-start; padding: 6px; border-radius: 6px; cursor: pointer; }
  .run:hover { background: var(--bg); }
  .run input { margin-top: 3px; }
  .run .name { font-weight: 500; word-break: break-all; }
  .run .when { color: var(--text-3); font-size: 12px; }
  .run .style { font-size: 12px; color: var(--text-2); font-family: ui-monospace, monospace; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--live); margin-left: 6px; vertical-align: middle; }
  main { padding: 16px; min-width: 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 16px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 12px 8px; min-width: 0; }
  .card h3 { margin: 0 0 8px; font-size: 14px; font-weight: 600; }
  .card .canvas-wrap { position: relative; height: 240px; }
  .config { margin-top: 16px; }
  .config pre {
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px;
    font-size: 12px; overflow: auto; max-height: 360px; color: var(--text-2); margin: 0 0 8px;
  }
  .empty { color: var(--text-3); padding: 40px 0; text-align: center; }
  .tabs { display: flex; gap: 4px; }
  .tabs button {
    font: inherit; color: var(--text-2); background: none; border: 1px solid transparent;
    border-radius: 6px; padding: 4px 12px; cursor: pointer;
  }
  .tabs button:hover { background: var(--bg); }
  .tabs button[aria-selected="true"] { color: var(--text); border-color: var(--border); background: var(--bg); font-weight: 600; }
  .smooth-ctl[hidden] { display: none; }
  .net-toolbar { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; margin-bottom: 12px; color: var(--text-2); }
  .net-toolbar label { display: flex; gap: 8px; align-items: center; }
  .net-toolbar input[type=range] { width: 200px; }
  .net-legend { display: flex; gap: 16px; align-items: center; font-size: 12px; }
  .net-legend i { display: inline-block; width: 18px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
  .net-info { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-bottom: 12px; }
  .net-info div { color: var(--text-3); font-size: 12px; }
  .net-info b { display: block; color: var(--text); font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .net-card { overflow-x: auto; }
  #netSvg { display: block; }
  #netSvg text { fill: var(--text-2); font-size: 11px; }
  #netSvg .edge { fill: none; }
  #netSvg .node circle.dot { stroke: var(--surface); stroke-width: 2; }
  #netSvg.focus .edge:not(.hl) { opacity: .06; }
  #netSvg.focus .node:not(.hl) { opacity: .3; }
  #netSvg.focus .node.hl text { fill: var(--text); font-weight: 600; }
  .tip {
    position: fixed; pointer-events: none; z-index: 5; display: none;
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
    padding: 8px 10px; font-size: 12px; color: var(--text-2); max-width: 280px; box-shadow: 0 4px 16px rgba(0,0,0,.15);
  }
  .tip b { color: var(--text); }
  .tip table { border-collapse: collapse; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .tip td { padding: 1px 6px 1px 0; }
  .tip .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; }
  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
    aside { border-right: 0; border-bottom: 1px solid var(--border); }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <h1>Training Dashboard</h1>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="metrics" aria-selected="true">Metrics</button>
    <button role="tab" data-tab="network" aria-selected="false">Network</button>
  </nav>
  <label class="smooth-ctl">Smoothing <input id="smooth" type="range" min="0" max="0.98" step="0.01" value="0"> <span id="smoothVal">0.00</span></label>
  <label><input id="follow" type="checkbox" checked> Follow newest run</label>
  <span class="spacer"></span>
  <span id="status">connecting…</span>
</header>
<div class="layout">
  <aside>
    <h2>Runs</h2>
    <div id="runs"></div>
    <div class="config" id="config"></div>
  </aside>
  <main>
    <section id="metricsView">
      <div class="grid" id="charts"></div>
      <div class="empty" id="empty">No data yet. Start a run that calls TrainingDashboard.BeginRun.</div>
    </section>
    <section id="networkView" hidden>
      <div class="net-toolbar">
        <label>Snapshot <input id="netStep" type="range" min="0" max="0" step="1" value="0"> <span id="netStepVal"></span></label>
        <label>Hide |w| below <input id="netMinW" type="range" min="0" max="2" step="0.05" value="0"> <span id="netMinWVal">0.00</span></label>
        <label><input id="netDisabled" type="checkbox"> Show disabled links</label>
        <span class="net-legend"><span><i style="background:var(--pos)"></i>positive weight</span><span><i style="background:var(--neg)"></i>negative weight</span><span>thickness = |weight|</span></span>
      </div>
      <div class="net-info" id="netInfo"></div>
      <div class="card net-card"><svg id="netSvg"></svg></div>
      <div class="empty" id="netEmpty">No network snapshots in this run yet. Log one with TrainingDashboard.LogNetwork.</div>
    </section>
  </main>
  <div class="tip" id="tip"></div>
</div>

<script>
const POLL_MS = 1500;
const LIVE_MS = 15000;                       // a run file touched this recently counts as live
const DASHES  = [[], [6, 4], [2, 3], [10, 3, 2, 3]]; // run 1 solid, run 2 dashed, ...

const runs     = new Map();   // file -> { meta, offset, rest, rows: [{step, t, v}] }
let   runList  = [];          // from /runs, newest first
let   selected = [];          // files, in selection order
const charts   = new Map();   // group -> { chart, card }
const keyOrder = new Map();   // group -> [series keys in first-seen order], fixes color per key

const $ = id => document.getElementById(id);
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

/* ---------------- data ---------------- */

let busy = false;

async function poll() {
  await refresh();
  setTimeout(poll, POLL_MS);
}

// One refresh at a time, otherwise two overlapping tails of a run would append the same rows twice.
async function refresh() {
  if (busy) return;
  busy = true;
  try {
    runList = await (await fetch('/runs')).json();
    if ($('follow').checked && runList.length && selected[0] !== runList[0].file) {
      selected = [runList[0].file];
    }
    selected = selected.filter(f => runList.some(r => r.file === f));
    for (const file of selected) await tail(file);
    renderRuns();
    renderActive();
    $('status').textContent = `updated ${new Date().toLocaleTimeString()}`;
  } catch (e) {
    $('status').textContent = 'server offline, retrying…';
  } finally {
    busy = false;
  }
}

// Fetch only the bytes appended since last time and parse complete lines.
async function tail(file) {
  let run = runs.get(file);
  if (!run) runs.set(file, run = { meta: null, offset: 0, rest: '', rows: [], networks: [] });
  const res = await fetch(`/runs/${encodeURIComponent(file)}?from=${run.offset}`);
  if (!res.ok) return;
  const buf = new Uint8Array(await res.arrayBuffer());
  run.offset += buf.length;
  const text = run.rest + new TextDecoder().decode(buf);
  const lines = text.split('\n');
  run.rest = lines.pop();                     // possibly half-written last line
  for (const line of lines) {
    if (!line.trim()) continue;
    let rec;
    try { rec = JSON.parse(line); } catch { continue; }
    if (rec.type === 'meta') run.meta = rec;
    else if (rec.type === 'network') run.networks.push(rec);
    else if (rec.v) run.rows.push(rec);
  }
}

function runLabel(file) {
  const run = runs.get(file);
  return run?.meta?.name ?? file.replace(/\.jsonl$/, '');
}

/* ---------------- sidebar ---------------- */

function renderRuns() {
  const now = Date.now();
  const el = $('runs');
  el.innerHTML = '';
  if (!runList.length) { el.innerHTML = '<div class="when">No runs in diagnostics/runs yet.</div>'; }
  for (const r of runList) {
    const idx = selected.indexOf(r.file);
    const live = now - Date.parse(r.modified) < LIVE_MS;
    const m = r.file.match(/^(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})(\d{2})_(.*)\.jsonl$/);
    const name = m ? m[7] : r.file;
    const when = m ? `${m[1]}-${m[2]}-${m[3]} ${m[4]}:${m[5]}:${m[6]}` : '';
    const row = document.createElement('label');
    row.className = 'run';
    row.innerHTML = `
      <input type="checkbox" ${idx >= 0 ? 'checked' : ''}>
      <div>
        <div class="name">${escapeHtml(name)}${live ? '<span class="dot" title="live"></span>' : ''}</div>
        <div class="when">${when}</div>
        ${idx >= 0 && selected.length > 1 ? `<div class="style">${['solid', 'dashed', 'dotted', 'dash-dot'][idx % 4]} line</div>` : ''}
      </div>`;
    row.querySelector('input').addEventListener('change', ev => {
      $('follow').checked = false;
      if (ev.target.checked) selected.push(r.file);
      else selected = selected.filter(f => f !== r.file);
      netFollow = true;
      refresh();
    });
    el.appendChild(row);
  }

  const cfg = $('config');
  cfg.innerHTML = '';
  for (const file of selected) {
    const meta = runs.get(file)?.meta;
    if (!meta?.config) continue;
    cfg.insertAdjacentHTML('beforeend',
      `<h2>Config · ${escapeHtml(meta.name)}</h2><pre>${escapeHtml(JSON.stringify(meta.config, null, 2))}</pre>`);
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* ---------------- charts ---------------- */

function splitKey(key) {
  const i = key.indexOf('/');
  return i < 0 ? [key, key] : [key.slice(0, i), key.slice(i + 1)];
}

// Exponential moving average with bias correction, like TensorBoard's smoothing.
function smooth(points, alpha) {
  if (alpha <= 0) return points;
  let last = 0, n = 0;
  return points.map(p => {
    last = last * alpha + (1 - alpha) * p.y;
    n++;
    return { x: p.x, y: last / (1 - Math.pow(alpha, n)) };
  });
}

function renderCharts() {
  const alpha = parseFloat($('smooth').value);
  const groups = new Map(); // group -> [{ file, key, points }]

  selected.forEach(file => {
    const run = runs.get(file);
    if (!run) return;
    const series = new Map();
    for (const row of run.rows) {
      for (const [key, y] of Object.entries(row.v)) {
        if (!series.has(key)) series.set(key, []);
        series.get(key).push({ x: row.step, y });
      }
    }
    for (const [key, points] of series) {
      const [group, name] = splitKey(key);
      if (!keyOrder.has(group)) keyOrder.set(group, []);
      if (!keyOrder.get(group).includes(name)) keyOrder.get(group).push(name);
      if (!groups.has(group)) groups.set(group, []);
      groups.get(group).push({ file, name, points });
    }
  });

  $('empty').style.display = groups.size ? 'none' : '';

  // Drop charts whose group no longer has data (e.g. a run was deselected).
  for (const [group, c] of charts) {
    if (!groups.has(group)) { c.chart.destroy(); c.card.remove(); charts.delete(group); }
  }

  const palette = [1, 2, 3, 4, 5, 6, 7, 8].map(i => css(`--s${i}`));
  const multiRun = selected.length > 1;

  for (const [group, list] of groups) {
    const order = keyOrder.get(group);
    const datasets = list.map(s => {
      const color = palette[order.indexOf(s.name) % palette.length];
      const last = s.points.length ? s.points[s.points.length - 1].y : NaN;
      return {
        label: (multiRun ? `${s.name} · ${runLabel(s.file)}` : s.name) + `  ${fmt(last)}`,
        id: `${s.file}|${s.name}`,
        data: smooth(s.points, alpha),
        borderColor: color,
        backgroundColor: color,
        borderWidth: 2,
        borderDash: DASHES[selected.indexOf(s.file) % DASHES.length],
        pointRadius: 0,
        pointHoverRadius: 4,
        tension: 0,
      };
    });

    let c = charts.get(group);
    if (!c) c = makeChart(group);

    // Keep legend toggles across updates, keyed by series id rather than position.
    const hidden = new Set();
    c.chart.data.datasets.forEach((d, i) => { if (!c.chart.isDatasetVisible(i)) hidden.add(d.id); });
    datasets.forEach(d => { d.hidden = hidden.has(d.id); });
    c.chart.data.datasets = datasets;
    c.chart.update('none');
  }
}

function fmt(v) {
  if (!Number.isFinite(v)) return '';
  const a = Math.abs(v);
  if (a !== 0 && (a < 0.01 || a >= 1e5)) return v.toExponential(2);
  return a >= 100 ? v.toFixed(0) : a >= 10 ? v.toFixed(1) : v.toFixed(3);
}

function makeChart(group) {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<h3>${escapeHtml(group)}</h3><div class="canvas-wrap"><canvas></canvas></div>`;
  // Insert in first-seen order so the layout is stable.
  $('charts').appendChild(card);

  const text = css('--text-2'), muted = css('--text-3'), grid = css('--grid'), surface = css('--surface'), border = css('--border');
  const chart = new Chart(card.querySelector('canvas'), {
    type: 'line',
    data: { datasets: [] },
    options: {
      animation: false,
      maintainAspectRatio: false,
      parsing: false,
      normalized: true,
      interaction: { mode: 'nearest', axis: 'x', intersect: false },
      scales: {
        x: { type: 'linear', title: { display: true, text: 'step', color: muted }, ticks: { color: muted }, grid: { color: grid }, border: { color: border } },
        y: { ticks: { color: muted }, grid: { color: grid }, border: { color: border } },
      },
      plugins: {
        legend: { position: 'bottom', labels: { color: text, boxWidth: 12, boxHeight: 2, padding: 10, font: { size: 12 } } },
        tooltip: {
          mode: 'index', intersect: false,
          backgroundColor: surface, borderColor: border, borderWidth: 1,
          titleColor: css('--text'), bodyColor: text, padding: 8,
          callbacks: {
            title: items => items.length ? `step ${items[0].parsed.x}` : '',
            label: item => ` ${item.dataset.label.split('  ')[0]}: ${fmt(item.parsed.y)}`,
          },
        },
      },
    },
  });
  const c = { chart, card };
  charts.set(group, c);
  return c;
}

/* ---------------- tabs ---------------- */

let tab = location.hash === '#network' ? 'network' : 'metrics';

function setTab(name) {
  tab = name;
  history.replaceState(null, '', name === 'network' ? '#network' : '#');
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === name));
  $('metricsView').hidden = name !== 'metrics';
  $('networkView').hidden = name !== 'network';
  document.querySelector('.smooth-ctl').hidden = name !== 'metrics';
  netRendered = '';
  renderActive();
}
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));

function renderActive() {
  if (tab === 'network') renderNetwork();
  else renderCharts();
}

/* ---------------- network ---------------- */

let netFollow   = true;   // stick to the newest snapshot until the user scrubs back
let netRendered = '';     // what is currently drawn, so polling doesn't redraw (and drop hover) needlessly

function renderNetwork() {
  // The network tab shows one run: the first selected one.
  const run  = runs.get(selected[0]);
  const nets = run?.networks ?? [];
  const slider = $('netStep');
  $('netEmpty').style.display = nets.length ? 'none' : '';
  $('netSvg').parentElement.style.display = nets.length ? '' : 'none';
  $('netInfo').style.display = nets.length ? '' : 'none';
  if (!nets.length) { netRendered = ''; $('netStepVal').textContent = ''; return; }

  slider.max = nets.length - 1;
  if (netFollow) slider.value = nets.length - 1;
  const idx = Math.min(parseInt(slider.value), nets.length - 1);
  const net = nets[idx];
  $('netStepVal').textContent = `${idx + 1} / ${nets.length}  (step ${net.step})`;

  const minW = parseFloat($('netMinW').value);
  const showDisabled = $('netDisabled').checked;
  const key = [selected[0], idx, minW, showDisabled, $('netSvg').parentElement.clientWidth, css('--pos')].join('|');
  if (key === netRendered) return;
  netRendered = key;

  drawNetwork(net, minW, showDisabled);
}

function drawNetwork(net, minW, showDisabled) {
  const svg = $('netSvg');
  const NS = 'http://www.w3.org/2000/svg';
  svg.innerHTML = '';
  svg.classList.remove('focus');
  $('tip').style.display = 'none';

  const nodes = net.nodes;
  const byId = new Map(nodes.map(n => [n.id, n]));
  const valid = net.edges.filter(e => byId.has(e.src) && byId.has(e.dst));
  const enabled = valid.filter(e => e.on);

  // Info strip: whatever the trainer put in `info`, plus counts.
  const info = { ...(net.info ?? {}) };
  info.nodes = nodes.length;
  info['enabled links'] = enabled.length;
  $('netInfo').innerHTML = Object.entries(info).map(([k, v]) =>
    `<div><b>${escapeHtml(typeof v === 'number' && !Number.isInteger(v) ? fmt(v) : v)}</b>${escapeHtml(k)}</div>`).join('');

  // Columns: one per distinct layer value, ranked so gaps in layer numbers collapse.
  const layers = [...new Set(nodes.map(n => n.layer))].sort((a, b) => a - b);
  const colOf = new Map(layers.map((l, i) => [l, i]));
  const cols = layers.map(() => []);
  nodes.forEach(n => cols[colOf.get(n.layer)].push(n));

  const ROW = 22, PAD = 20;
  const maxRows = Math.max(...cols.map(c => c.length));
  const height = PAD * 2 + (maxRows - 1) * ROW;
  const width = Math.max(svg.parentElement.clientWidth - 26, 720);
  const left = 170, right = 140;
  const colX = i => layers.length === 1 ? left : left + i * (width - left - right) / (layers.length - 1);

  const incoming = new Map(nodes.map(n => [n.id, []]));
  const outgoing = new Map(nodes.map(n => [n.id, []]));
  for (const e of valid) {
    incoming.get(e.dst).push(e);
    outgoing.get(e.src).push(e);
  }

  // Inputs and outputs keep their logged order. Hidden nodes are sorted by the mean
  // height of their sources, which cuts down on crossing lines.
  const pos = new Map();
  cols.forEach((col, ci) => {
    if (col.some(n => n.kind === 'hidden')) {
      const score = n => {
        const ys = incoming.get(n.id).filter(e => e.on && pos.has(e.src)).map(e => pos.get(e.src).y);
        return ys.length ? ys.reduce((a, b) => a + b, 0) / ys.length : height / 2;
      };
      const scores = new Map(col.map(n => [n.id, score(n)]));
      col.sort((a, b) => scores.get(a.id) - scores.get(b.id));
    }
    const top = (height - (col.length - 1) * ROW) / 2;
    col.forEach((n, i) => pos.set(n.id, { x: colX(ci), y: top + i * ROW }));
  });

  svg.setAttribute('width', width);
  svg.setAttribute('height', height);
  svg.setAttribute('viewBox', `0 0 ${width} ${height}`);

  // Thickness/opacity scale off the 95th percentile |w| so one huge weight
  // doesn't flatten everything else.
  const mags = enabled.map(e => Math.abs(e.w)).sort((a, b) => a - b);
  const wRef = mags.length ? Math.max(mags[Math.min(mags.length - 1, Math.floor(mags.length * 0.95))], 1e-6) : 1;
  const posC = css('--pos'), negC = css('--neg'), offC = css('--text-3');

  const edgeLayer = document.createElementNS(NS, 'g');
  svg.appendChild(edgeLayer);
  const edgeEls = new Map(); // node id -> [{ path, other }]
  const drawn = valid
    .filter(e => e.on ? Math.abs(e.w) >= minW : showDisabled)
    .sort((a, b) => Math.abs(a.w) - Math.abs(b.w)); // strong links on top
  for (const e of drawn) {
    const a = pos.get(e.src), b = pos.get(e.dst);
    const t = Math.min(Math.abs(e.w) / wRef, 1);
    const dx = (b.x - a.x) * 0.5;
    const path = document.createElementNS(NS, 'path');
    path.setAttribute('d', `M${a.x},${a.y} C${a.x + dx},${a.y} ${b.x - dx},${b.y} ${b.x},${b.y}`);
    path.setAttribute('class', 'edge');
    if (e.on) {
      path.setAttribute('stroke', e.w >= 0 ? posC : negC);
      path.setAttribute('stroke-width', (0.5 + 3 * t).toFixed(2));
      path.setAttribute('stroke-opacity', (0.12 + 0.78 * t).toFixed(2));
    } else {
      path.setAttribute('stroke', offC);
      path.setAttribute('stroke-width', 1);
      path.setAttribute('stroke-opacity', 0.5);
      path.setAttribute('stroke-dasharray', '3 3');
    }
    edgeLayer.appendChild(path);
    for (const [id, other] of [[e.src, e.dst], [e.dst, e.src]]) {
      if (!edgeEls.has(id)) edgeEls.set(id, []);
      edgeEls.get(id).push({ path, other });
    }
  }

  const nodeLayer = document.createElementNS(NS, 'g');
  svg.appendChild(nodeLayer);
  const nodeEls = new Map();
  const fills = { input: css('--node-in'), output: css('--node-out'), hidden: css('--s7') };
  for (const n of nodes) {
    const p = pos.get(n.id);
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('class', 'node');
    const c = document.createElementNS(NS, 'circle');
    c.setAttribute('class', 'dot');
    c.setAttribute('cx', p.x); c.setAttribute('cy', p.y);
    c.setAttribute('r', n.kind === 'hidden' ? 7 : 6);
    c.setAttribute('fill', fills[n.kind] ?? fills.hidden);
    g.appendChild(c);
    if (n.kind !== 'hidden' && n.label) {
      const txt = document.createElementNS(NS, 'text');
      const isIn = n.kind === 'input';
      txt.setAttribute('x', isIn ? p.x - 12 : p.x + 12);
      txt.setAttribute('y', p.y + 4);
      txt.setAttribute('text-anchor', isIn ? 'end' : 'start');
      txt.textContent = n.label;
      g.appendChild(txt);
    }
    // Invisible hit target bigger than the dot so small nodes are easy to hover.
    const hit = document.createElementNS(NS, 'circle');
    hit.setAttribute('cx', p.x); hit.setAttribute('cy', p.y); hit.setAttribute('r', 11);
    hit.setAttribute('fill', 'transparent');
    g.appendChild(hit);
    g.addEventListener('mouseenter', ev => focusNode(n, ev));
    g.addEventListener('mousemove', moveTip);
    g.addEventListener('mouseleave', unfocus);
    nodeLayer.appendChild(g);
    nodeEls.set(n.id, g);
  }

  function nodeName(n) { return n.label ?? `hidden #${n.id}`; }

  function focusNode(n, ev) {
    svg.classList.add('focus');
    nodeEls.get(n.id).classList.add('hl');
    for (const { path, other } of edgeEls.get(n.id) ?? []) {
      path.classList.add('hl');
      nodeEls.get(other)?.classList.add('hl');
    }
    const strongest = list => list.filter(e => e.on).sort((a, b) => Math.abs(b.w) - Math.abs(a.w)).slice(0, 6);
    const row = (e, otherId) =>
      `<tr><td><span class="sw" style="background:${e.w >= 0 ? posC : negC}"></span></td>` +
      `<td>${escapeHtml(nodeName(byId.get(otherId)))}</td><td>${fmt(e.w)}</td></tr>`;
    const ins = strongest(incoming.get(n.id)), outs = strongest(outgoing.get(n.id));
    let html = `<b>${escapeHtml(nodeName(n))}</b> <span>(${n.kind}, layer ${n.layer})</span>`;
    if (n.kind !== 'input') html += `<div>bias ${fmt(n.bias)}</div>`;
    if (ins.length) html += `<div style="margin-top:6px">strongest inputs</div><table>${ins.map(e => row(e, e.src)).join('')}</table>`;
    if (outs.length) html += `<div style="margin-top:6px">strongest outputs</div><table>${outs.map(e => row(e, e.dst)).join('')}</table>`;
    $('tip').innerHTML = html;
    $('tip').style.display = 'block';
    moveTip(ev);
  }

  function unfocus() {
    svg.classList.remove('focus');
    svg.querySelectorAll('.hl').forEach(el => el.classList.remove('hl'));
    $('tip').style.display = 'none';
  }
}

function moveTip(ev) {
  const tip = $('tip');
  const x = Math.min(ev.clientX + 14, innerWidth - tip.offsetWidth - 8);
  const y = Math.min(ev.clientY + 14, innerHeight - tip.offsetHeight - 8);
  tip.style.left = `${x}px`;
  tip.style.top = `${y}px`;
}

$('netStep').addEventListener('input', () => {
  netFollow = parseInt($('netStep').value) === parseInt($('netStep').max);
  renderNetwork();
});
$('netMinW').addEventListener('input', () => {
  $('netMinWVal').textContent = parseFloat($('netMinW').value).toFixed(2);
  renderNetwork();
});
$('netDisabled').addEventListener('change', renderNetwork);
addEventListener('resize', () => { if (tab === 'network') renderNetwork(); });

// Colors come from CSS tokens, so rebuild the charts when the OS theme flips.
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  for (const c of charts.values()) { c.chart.destroy(); c.card.remove(); }
  charts.clear();
  netRendered = '';
  renderActive();
});

$('smooth').addEventListener('input', () => {
  $('smoothVal').textContent = parseFloat($('smooth').value).toFixed(2);
  renderCharts();
});
$('follow').addEventListener('change', () => { if ($('follow').checked) refresh(); });

setTab(tab);
poll();
</script>
</body>
</html>
