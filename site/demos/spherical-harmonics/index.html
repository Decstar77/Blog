<!doctypehtml><html lang=en><head><meta charset=utf-8><meta content="width=device-width,initial-scale=1"name=viewport><title>Spherical Harmonics</title><style>body,html{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden;font-family:Inter,system-ui,sans-serif}canvas.emscripten{display:block;width:100%;height:100%;border:0;outline:0;background:#000}#loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#ddd;font-size:.9rem;gap:14px;background:#000;text-align:center}#bar{width:220px;height:4px;background:#333;border-radius:2px;overflow:hidden}#barFill{height:100%;width:0%;background:#6ab8ff;transition:width .15s linear}#note{color:#888;font-size:.78rem;max-width:30ch;line-height:1.5}#loading.done{display:none}</style></head><body><canvas class=emscripten id=canvas oncontextmenu=event.preventDefault() tabindex=-1></canvas><div id=loading><div id=msg>Downloading environment map…</div><div id=bar><div id=barFill></div></div><div id=note>5 MB of HDR, then the SH projection runs on the main thread. Give it a few seconds.</div></div><script>var canvasEl=document.getElementById("canvas"),loadingEl=document.getElementById("loading"),barFill=document.getElementById("barFill"),msgEl=document.getElementById("msg");function hideOverlay(){loadingEl.classList.add("done")}var Module={canvas:canvasEl,print:function(n){console.log(n),/initialized successfully/i.test(n)&&hideOverlay()},printErr:function(n){console.error(n)},setStatus:function(n){var t=n.match(/([\d.]+)\s*\/\s*([\d.]+)/);t?barFill.style.width=parseFloat(t[1])/parseFloat(t[2])*100+"%":n||(barFill.style.width="100%")},onRuntimeInitialized:function(){msgEl.textContent="Projecting into spherical harmonics…",barFill.style.width="100%"}};canvasEl.addEventListener("mousedown",(function(){canvasEl.focus()}))</script><script async src=SphericalHarmonics.js></script></body></html>
