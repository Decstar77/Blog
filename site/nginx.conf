server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy /api/ requests to the runner service
    location /api/ {
        proxy_pass         http://runner:8000/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    # Proxy /tracker/ requests to the tracker service
    location /tracker/ {
        proxy_pass         http://tracker:8001/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 10s;
    }

    # Streaming WebAssembly instantiation is rejected unless the MIME type is
    # exactly application/wasm. default_type only kicks in when mime.types has
    # no mapping, so this is a no-op on images that already know about .wasm.
    location ~ \.wasm$ {
        default_type application/wasm;
    }

    # The emscripten bundles are the largest things on the site. The .data
    # preload is an already-compressed EXR, so it is deliberately left alone.
    gzip             on;
    gzip_min_length  1024;
    gzip_proxied     any;
    gzip_types       text/css application/javascript application/wasm image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }
}
